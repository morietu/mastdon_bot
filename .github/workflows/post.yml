# post.yml
name: Daily Mastodon Post

on:
  push:
    branches:
      - develop
  workflow_dispatch:  #手動実行ボタンの表示
  schedule:
    - cron: '0 23 * * *'  # JST 08:00 に合わせる（UTC 23:00）

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: pip install Mastodon.py

      - name: Run bot script
        env:
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
        run: python post_now.py
