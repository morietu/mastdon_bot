name: Daily Mastodon Post

on:
  push:
    branches:
      - develop
  workflow_dispatch:  # ✅ 手動実行もOK
  schedule:
    - cron: '0 0 * * *'   # JST 09:00（朝）
    - cron: '0 5 * * *'   # JST 14:00（昼）
    - cron: '0 9 * * *'   # JST 18:00（夕方）
    - cron: '0 12 * * *'  # JST 21:00（夜）
    - cron: '0 14 * * *'  # JST 23:00（深夜）

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: ✅ リポジトリをチェックアウト
        uses: actions/checkout@v3

      - name: ✅ Pythonセットアップ（v3.11）
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: ✅ 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: ✅ Botスクリプトを実行
        env:
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python post_now.py
